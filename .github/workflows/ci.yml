name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      nsis_helpers_only:
        description: Build pinned NSIS helpers twice and retain evidence (no publication)
        type: boolean
        default: false
      windows_crt_audit:
        description: Inspect Windows release linker inputs and test installer/ZIP (no publication)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  nsis-helpers:
    if: inputs.nsis_helpers_only
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.99.0"
          targets: i686-pc-windows-msvc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - run: python packaging/nsis_helpers.py build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nsis-helper-evidence
          path: |
            target/packaging/nsis-helpers/provenance.json
            target/packaging/nsis-helpers/plugins/*
            target/packaging/nsis-helpers/first/*.dll/*
            target/packaging/nsis-helpers/second/*.dll/*
          if-no-files-found: error
  check:
    if: ${{ !inputs.nsis_helpers_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev dbus
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - run: python -m unittest discover -s packaging -p 'test_*.py'
      # An opt-in diagnostic run, not a release candidate. Keep release pins.
      - name: Install audited Windows release tools
        if: runner.os == 'Windows' && inputs.windows_crt_audit
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install audited Rust toolchain' }
          cargo +1.99.0 install --locked --version 0.11.8 cargo-packager
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install audited packager' }
      - name: Capture Windows CRT provenance and verify packages
        if: runner.os == 'Windows' && inputs.windows_crt_audit
        env:
          RUSTUP_TOOLCHAIN: "1.99.0"
        run: |
          python packaging/build.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows CRT provenance capture failed' }
          python packaging/release.py windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging verification failed' }
          ./packaging/windows-smoke.ps1
      - name: Retain Windows CRT diagnostic evidence
        if: always() && runner.os == 'Windows' && inputs.windows_crt_audit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-crt-audit
          path: |
            target/packaging/windows-crt/*
            dist/*windows*
          if-no-files-found: error
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - name: Linux desktop services unavailable
        if: runner.os == 'Linux'
        env:
          CODECONVOY_PRIVATE_BUS_TEST: "1"
        run: dbus-run-session -- cargo test --locked --all-features --test linux_desktop -- --ignored --nocapture
      - name: Windows software graphics startup
        if: runner.os == 'Windows'
        run: cargo test --locked --bin codeconvoy software_adapter_initializes_egui_renderer -- --ignored --nocapture
      - run: cargo build --locked --release --bin codeconvoy
        if: runner.os != 'Windows' || !inputs.windows_crt_audit
