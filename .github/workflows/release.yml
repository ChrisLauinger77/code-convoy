name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # renovate: datasource=crate depName=cargo-packager
  PACKAGER_VERSION: "0.11.8"

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Validate Cargo version and release gates
        run: |
          python packaging/release.py version
          python -m unittest discover -s packaging -p 'test_*.py'

  linux:
    needs: validate
    # Only this job builds Linux ELF output; other jobs do not set its glibc ABI.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Native build and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-3 libfontconfig1 rpm rpm2cpio cpio desktop-file-utils file patchelf squashfs-tools xvfb xauth openbox wmctrl dbus-x11 bubblewrap
      - name: Allow user namespaces for the runtime sandbox executable
        run: |
          # Ubuntu 24.04 restricts capabilities in unprofiled user namespaces.
          # Keep that global policy enabled and authorize only host bubblewrap.
          sudo tee /etc/apparmor.d/codeconvoy-runtime-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          profile codeconvoy-runtime-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/codeconvoy-runtime-bwrap
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: python packaging/build.py
      - run: python packaging/build.py --probe
      - run: cargo install --locked --version "$PACKAGER_VERSION" cargo-packager
      - name: Package and verify DEB, RPM, AppImage and host tools
        run: python packaging/release.py linux
      - name: Verify runtime clean-build repeatability
        run: |
          python third-party/runtime/build-runtime.py build --sources third-party/sources --cache target/appimage-runtime-inputs --work target/runtime-repeat
          python packaging/appimage_runtime.py target/packaging/linux/runtime-build/out target/runtime-repeat/out
      - name: Retain AppImage runtime build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-runtime-diagnostics
          path: |
            target/packaging/linux/runtime-build/build.log
            target/runtime-repeat/build.log
          if-no-files-found: warn
      # Retain verified package bytes for diagnosis if a runtime check fails.
      # Aggregation still requires the entire Linux job to succeed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-linux
          path: dist/*
          if-no-files-found: error
      - name: Fresh AppImage startup on a virtual desktop
        run: xvfb-run -a python packaging/smoke.py dist/CodeConvoy-$(python packaging/release.py version)-x86_64.AppImage
      - name: AppImage FUSE startup and normal close when available
        run: |
          if test -c /dev/fuse; then
            xvfb-run -a dbus-run-session -- python packaging/linux_runtime.py dist/*.AppImage --mode fuse
          else
            echo 'FUSE device unavailable; mounted startup remains a native validation gap.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Exact packages on clean Ubuntu 24.04, Debian 13 and Fedora 44 userspaces
        run: |
          status=0
          docker run --rm --init -v "$PWD:/candidate:ro" ubuntu:24.04 bash /candidate/packaging/linux-container-smoke.sh ubuntu || status=1
          docker run --rm --init -v "$PWD:/candidate:ro" debian:13 bash /candidate/packaging/linux-container-smoke.sh debian || status=1
          docker run --rm --init -v "$PWD:/candidate:ro" fedora:44 bash /candidate/packaging/linux-container-smoke.sh fedora || status=1
          exit "$status"

  windows:
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
          targets: i686-pc-windows-msvc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: python packaging/build.py
      - run: cargo install --locked --version "$env:PACKAGER_VERSION" cargo-packager
      - run: python packaging/release.py windows
      - name: Verify executable metadata, installer, portable archive and uninstall
        run: |
          ./packaging/windows-smoke.ps1
          ./packaging/windows-smoke.ps1 -UnicodePath
          python packaging/nsis_helpers.py test
          if ($LASTEXITCODE -ne 0) { throw 'Native NSIS helper regression tests failed' }
      - name: Retain Windows linker and helper evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-crt-evidence
          path: |
            target/packaging/windows-crt/*
            target/packaging/nsis-helpers/provenance.json
            target/packaging/nsis-helpers/plugins/*
            target/packaging/nsis-helpers/first/*.dll/*
            target/packaging/nsis-helpers/second/*.dll/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-windows
          path: dist/*
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: python packaging/build.py --target aarch64-apple-darwin
      - run: python packaging/build.py --target x86_64-apple-darwin
      - run: cargo install --locked --version "$PACKAGER_VERSION" cargo-packager
      - name: Assemble Universal app, ad-hoc sign, verify, create and inspect DMG
        run: python packaging/release.py macos
      - name: Fresh packaged startup
        run: python packaging/smoke.py target/packaging/macos/packages/CodeConvoy.app/Contents/MacOS/codeconvoy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-macos
          path: dist/*
          if-no-files-found: error

  aggregate:
    needs: [linux, windows, macos]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Require all six final assets and generate SHA256SUMS
        run: python packaging/release.py aggregate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Print the exact commands to publish this candidate
        run: python packaging/candidate.py commands

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Verify annotated tag and candidate run
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python packaging/candidate.py resolve
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Publish the complete release once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python packaging/publish.py

  update-package-repositories:
    name: Request package repository updates
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    needs: publish
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ secrets.PACKAGE_REPOSITORIES_TOKEN }}
    steps:
      - name: Use scheduled fallback when no cross-repository token exists
        if: ${{ env.GH_TOKEN == '' }}
        run: echo 'PACKAGE_REPOSITORIES_TOKEN is not configured; the daily Scoop and Homebrew updaters will publish this version.'
      - name: Dispatch Scoop and Homebrew updates
        if: ${{ env.GH_TOKEN != '' }}
        shell: bash
        run: |
          gh api --method POST repos/ChrisLauinger77/scoop-bucket/dispatches -f event_type=update-scoop
          gh api --method POST repos/ChrisLauinger77/homebrew-cask/dispatches -f event_type=update-cask -F 'client_payload[cask]=code-convoy'
