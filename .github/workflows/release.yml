name: Release
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # renovate: datasource=crate depName=cargo-packager
  PACKAGER_VERSION: "0.11.8"

jobs:
  validate:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Validate Cargo version and release gates
        id: source
        run: |
          version="$(python packaging/release.py version)"
          sha="$(git rev-parse HEAD)"
          echo "CodeConvoy $version at $sha"
          python -m unittest discover -s packaging -p 'test_*.py'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  linux:
    needs: validate
    # Only this job builds Linux ELF output; other jobs do not set its glibc ABI.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Native build and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-3 libfontconfig1 rpm rpm2cpio cpio desktop-file-utils file patchelf squashfs-tools xvfb xauth openbox wmctrl dbus-x11
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: python packaging/build.py
      - run: python packaging/build.py --probe
      - run: cargo install --locked --version "$PACKAGER_VERSION" cargo-packager
      - name: Package and verify DEB, RPM, AppImage and host tools
        run: python packaging/release.py linux
      # Retain verified package bytes for diagnosis if a runtime check fails.
      # Aggregation still requires the entire Linux job to succeed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-linux
          path: dist/*
          if-no-files-found: error
      - name: Fresh AppImage startup on a virtual desktop
        run: xvfb-run -a python packaging/smoke.py dist/CodeConvoy-$(python packaging/release.py version)-x86_64.AppImage
      - name: AppImage FUSE startup and normal close when available
        run: |
          if test -c /dev/fuse; then
            xvfb-run -a dbus-run-session -- python packaging/linux_runtime.py dist/*.AppImage --mode fuse
          else
            echo 'FUSE device unavailable; mounted startup remains a native validation gap.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Exact packages on clean Ubuntu 24.04, Debian 13 and Fedora 44 userspaces
        run: |
          status=0
          docker run --rm --init -v "$PWD:/candidate:ro" ubuntu:24.04 bash /candidate/packaging/linux-container-smoke.sh ubuntu || status=1
          docker run --rm --init -v "$PWD:/candidate:ro" debian:13 bash /candidate/packaging/linux-container-smoke.sh debian || status=1
          docker run --rm --init -v "$PWD:/candidate:ro" fedora:44 bash /candidate/packaging/linux-container-smoke.sh fedora || status=1
          exit "$status"

  windows:
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: python packaging/build.py
      - run: cargo install --locked --version "$env:PACKAGER_VERSION" cargo-packager
      - run: python packaging/release.py windows
      - name: Verify executable metadata, installer, portable archive and uninstall
        run: |
          ./packaging/windows-smoke.ps1
          ./packaging/windows-smoke.ps1 -ReleasedUpgrade
          ./packaging/windows-smoke.ps1 -UnicodePath -ReleasedUpgrade
          ./packaging/windows-installer-tests.ps1 -MakeNSIS "$env:LOCALAPPDATA/.cargo-packager/NSIS/makensis.exe"
          python packaging/windows_runtime.py test
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime prerequisite tests failed' }
      - name: Retain Windows application linker and installer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-crt-evidence
          path: |
            target/packaging/windows-crt/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-windows
          path: dist/*
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: python packaging/build.py --target aarch64-apple-darwin
      - run: python packaging/build.py --target x86_64-apple-darwin
      - run: cargo install --locked --version "$PACKAGER_VERSION" cargo-packager
      - name: Assemble Universal app, ad-hoc sign, verify, create and inspect DMG
        run: python packaging/release.py macos
      - name: Fresh packaged startup
        run: python packaging/smoke.py target/packaging/macos/packages/CodeConvoy.app/Contents/MacOS/codeconvoy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-macos
          path: dist/*
          if-no-files-found: error

  aggregate:
    needs: [linux, windows, macos]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Require all six final assets and generate SHA256SUMS
        run: python packaging/release.py aggregate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Describe the release approval for this candidate
        run: python packaging/candidate.py

  # Waits for a required reviewer of the release environment. Tags pushed with
  # GITHUB_TOKEN start no workflow, so approval publishes from this run only.
  approve-and-tag:
    needs: [validate, aggregate]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
      # Reads the release environment's protection rules.
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_SHA: ${{ needs.validate.outputs.sha }}
      CANDIDATE_RUN: ${{ github.run_id }}
      RELEASE_TAG: v${{ needs.validate.outputs.version }}
    steps:
      # GitHub creates a missing environment without protection rules, and this
      # job then starts without approval. Refuse to tag unless reviewers gate it.
      - name: Require reviewers for the release environment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          reviewers="$(gh api "repos/$GH_REPO/environments/release" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length')" || {
            echo "::error::Cannot read the release environment's protection rules; nothing was tagged."
            exit 1
          }
          if [ "$reviewers" -ge 1 ] 2> /dev/null; then
            echo "Release environment required reviewers: $reviewers"
          else
            echo "::error::The release environment has no required reviewers; nothing was tagged. Add one under Settings > Environments > release, then re-run failed jobs."
            exit 1
          fi
      # Keeps the checkout credentials: this job pushes the release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      # Expired/missing candidates must fail before consuming a release tag.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Configure the release tagger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
      - name: Validate publication gates and create or recover the release tag
        id: tag
        run: python packaging/candidate.py tag

  publish:
    needs: approve-and-tag
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      # The approved packages from this run; publication never rebuilds them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Publish the complete release once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.approve-and-tag.outputs.tag }}
        run: python packaging/publish.py

  update-package-repositories:
    name: Request package repository updates
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    needs: [approve-and-tag, publish]
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ secrets.PACKAGE_REPOSITORIES_TOKEN }}
    steps:
      - name: Use scheduled fallback when no cross-repository token exists
        if: ${{ env.GH_TOKEN == '' }}
        run: echo 'PACKAGE_REPOSITORIES_TOKEN is not configured; the daily Scoop and Homebrew updaters will publish this version.'
      - name: Dispatch Scoop and Homebrew updates
        if: ${{ env.GH_TOKEN != '' }}
        shell: bash
        run: |
          gh api --method POST repos/ChrisLauinger77/scoop-bucket/dispatches -f event_type=update-scoop
          gh api --method POST repos/ChrisLauinger77/homebrew-cask/dispatches -f event_type=update-cask -F 'client_payload[cask]=code-convoy'
