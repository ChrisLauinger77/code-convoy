[package]
name = "codeconvoy"
default-run = "codeconvoy"
version = "0.8.0"
edition = "2024"
rust-version = "1.95"
description = "A local desktop task runner for coding-agent CLIs across Git repositories"
license = "MIT"
repository = "https://github.com/ChrisLauinger77/code-convoy"
homepage = "https://github.com/ChrisLauinger77/code-convoy"

[dependencies]
anyhow = "1"
# Claude's documented image input uses base64; SHA-256 detects attachment changes.
base64 = "0.23.0"
directories = "6"
# Native hyperlinks need this explicit feature because eframe defaults are disabled.
eframe = { version = "0.36.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit", "links"] }
fs2 = "0.4"
process-wrap = { version = "10.0", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop", "creation-flags"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
# Full Unicode case folding for repository filtering, without a search engine.
unicase = "2.10"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# zbus 5.19 selects Tokio inside our runtime and async-io for desktop consumers
# outside it. Both transports share the existing application runtime safely.
notify-rust = "4.18.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Direct async SNI: runs on our existing Tokio runtime; observes tray-host loss.
ksni = "0.3.6"
# Required for dual-runtime selection shared with accessibility/notifications.
zbus = { version = "5.19", default-features = false, features = ["async-io"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
# Native menus on the existing eframe event loop; no GTK or extra UI thread.
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# The same modern backend offered by notify-rust, with cancellable async responses.
mac-usernotifications = { version = "0.3.1", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSAttributedString", "NSFont", "NSParagraphStyle", "NSText"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSDictionary", "NSArray", "NSAttributedString"] }

[target.'cfg(windows)'.dependencies]
# Standalone native WinRT wrapper (no Tauri framework or web runtime).
tauri-winrt-notification = "0.8.1"
windows-registry = "0.100"
windows = { version = "0.62", features = ["Win32_System_Threading"] }
# DX12 exposes Windows' WARP software adapter as well as hardware GPUs, avoiding
# a modern OpenGL requirement in VMs. Other platforms keep their existing renderer.
eframe = { version = "0.36.0", default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30.0", default-features = false, features = ["dx12", "wgsl"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
strip = true

[lints.clippy]
unwrap_used = "warn"

[features]
test-support = []

[[bin]]
name = "codeconvoy-test-agent"
path = "tests/support/agent.rs"
required-features = ["test-support"]
test = false
bench = false

[[example]]
name = "package_probe"
required-features = ["test-support"]

[[example]]
name = "v02_validation"
required-features = ["test-support"]

[[example]]
name = "v03_worktree_validation"
required-features = ["test-support"]

[[example]]
name = "v03_recovery_validation"
required-features = ["test-support"]

[[example]]
name = "v03_review_validation"
required-features = ["test-support"]

[[example]]
name = "v03_continuation_validation"
required-features = ["test-support"]

[[example]]
name = "v05_visibility_validation"
required-features = ["test-support"]

[[example]]
name = "v06_desktop_validation"
required-features = ["test-support"]

[[example]]
name = "v08_validation_presets"
required-features = ["test-support"]
